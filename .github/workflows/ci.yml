name: Tests and static verification

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[api]" pytest httpx
      - name: Python compile and tests
        run: |
          python -m compileall -q agents reflect_critic cli.py enrichment.py
          python -m pytest -q
      - name: Browser script syntax
        run: node --check web/app.js
      - name: Browser logic tests
        run: node --test web/app.test.cjs

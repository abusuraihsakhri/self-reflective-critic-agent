[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "self-reflective-critic-engine"
version = "2.0.0"
description = "ReflectCritic: Long-Horizon Execution Quality & Error Recovery Arbiter"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
self-reflective-critic-engine = "reflect_critic.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/self-reflective-critic-engine"
Repository = "https://github.com/abusuraihsakhri/self-reflective-critic-engine.git"
